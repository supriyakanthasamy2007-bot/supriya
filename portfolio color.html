        }

        h1 span {
            color: #0b5f7b;
        }

        p {
            font-size: 18px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #1595c0;
            color: aliceblue;
            text-decoration: none;
            border-radius: 25px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="box">
