<!DOCTYPE html>
<html>
<head>
    <title>My Restaurant</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f8f8f8;
        }
        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #555;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }
        section {
            padding: 20px;
        }
        .menu-item {
            background: white;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        img {
            width: 100%;
            height: 300px;
            border-radius: 10px;
            margin-bottom: 20px;
            object-fit: cover;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Welcome to My Restaurant</h1>
    <p>Delicious Food & Great Ambience</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">Contact</a>
</nav>

<section>

    <!-- 🔥 Image added here -->
    <h2>Our Restaurant</h2>
    <img src="restaurant image.webp" alt="Our Restaurant">

    <h2>Our Menu</h2>

    <div class="menu-item">
        <h3>Pizza</h3>
        <p>Cheesy delight with fresh toppings</p>
    </div>

    <div class="menu-item">
        <h3>Burger</h3>
        <p>Juicy grilled burger with fries</p>
    </div>

    <div class="menu-item">
        <h3>Ice Cream</h3>
        <p>Sweet and cold desserts</p>
    </div>
</section>

<footer>
    <p>📍 Location: Chennai | 📞 Contact: 1234567890</p>
</footer>

</body>
</html>
